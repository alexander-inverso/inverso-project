  <script type="module">
    import { initPage } from "/assets/js/page.js";

    /* Zoom: la hoja crece en % del escenario, y las zonas de enlace, que van en
       %, crecen con ella. Al pasar del 100% el escenario se vuelve una ventana
       con scroll, y se conserva el punto que estabas mirando. */
    const STEPS = [1, 1.25, 1.5, 2, 2.5, 3];
    const stage = document.querySelector("[data-doc-stage]");
    const sheet = document.querySelector("[data-doc-sheet]");
    const pct = document.querySelector("[data-zoom-pct]");
    const btns = [...document.querySelectorAll("[data-zoom]")];
    let i = 0;

    const apply = (wasZoomed) => {
      /* al 100% el escenario no tiene scroll propio: entonces se entra por
         arriba. Si ya estaba ampliado, se conserva el punto que mirabas. */
      const centre = wasZoomed && {
        x: (stage.scrollLeft + stage.clientWidth / 2) / (sheet.offsetWidth || 1),
        y: (stage.scrollTop + stage.clientHeight / 2) / (sheet.offsetHeight || 1),
      };
      sheet.style.width = STEPS[i] * 100 + "%";
      stage.classList.toggle("is-zoomed", i > 0);
      pct.textContent = Math.round(STEPS[i] * 100) + "%";
      btns[0].disabled = i === 0;
      btns[1].disabled = i === STEPS.length - 1;
      if (i === 0) return;
      stage.scrollLeft = centre
        ? centre.x * sheet.offsetWidth - stage.clientWidth / 2
        : (sheet.offsetWidth - stage.clientWidth) / 2;
      stage.scrollTop = centre ? centre.y * sheet.offsetHeight - stage.clientHeight / 2 : 0;
    };

    btns.forEach((b) =>
      b.addEventListener("click", () => {
        const wasZoomed = i > 0;
        i = Math.min(STEPS.length - 1, Math.max(0, i + (b.dataset.zoom === "in" ? 1 : -1)));
        apply(wasZoomed);
      }));
    apply(false);

    initPage();
  </script>
